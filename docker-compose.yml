version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: tap_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: tap_db
    volumes:
      - mongo_data:/data/db
    networks:
      - tap_network

  # Interfaz web para administrar MongoDB visualmente (http://localhost:8081)
  mongo-express:
    image: mongo-express:latest
    container_name: tap_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: rootpassword
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongodb
    networks:
      - tap_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tap_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: mongodb
      DB_HOST: mongodb
      DB_PORT: 27017
      DB_DATABASE: tap_db
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    depends_on:
      - mongodb
    networks:
      - tap_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tap_frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - tap_network

networks:
  tap_network:
    driver: bridge

volumes:
  mongo_data: