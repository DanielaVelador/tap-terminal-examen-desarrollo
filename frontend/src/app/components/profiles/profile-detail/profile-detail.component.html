@if (detail) {
  <mat-card class="detail-card">
    <mat-card-header>
      <mat-card-title>{{ detail.name }}</mat-card-title>
      <mat-card-subtitle>Código: {{ detail.code || 'N/A' }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <h3>Secciones con acceso</h3>
      @if (detail.sections?.length) {
        <mat-chip-set>
          @for (section of detail.sections; track section.id) {
            <mat-chip>{{ section.name }}</mat-chip>
          }
        </mat-chip-set>
      } @else {
        <p>Este perfil no tiene secciones asignadas</p>
      }
    </mat-card-content>

    <mat-card-actions>
      <button mat-stroked-button (click)="back()">Volver</button>
    </mat-card-actions>
  </mat-card>
}
