<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>{{ isEditMode ? 'Editar perfil' : 'Nuevo perfil' }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" />
        @if (name?.hasError('required') && name?.touched) {
          <mat-error>El nombre es requerido</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Secciones con acceso</mat-label>
        <mat-select formControlName="section_ids" multiple>
          @for (section of sections; track section.id) {
            <mat-option [value]="section.id">{{ section.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <div class="form-actions">
        <button mat-stroked-button type="button" (click)="cancel()">Cancelar</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="loading">
          {{ isEditMode ? 'Actualizar' : 'Crear' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
