<div class="header">
  <h2>Usuarios</h2>
  <div class="actions">
    <button mat-stroked-button (click)="exportPdf()">Exportar PDF</button>
    <button mat-stroked-button (click)="exportExcel()">Exportar Excel</button>
    <button mat-raised-button color="primary" (click)="create()">+ Nuevo usuario</button>
  </div>
</div>

<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2 full-width">
  <ng-container matColumnDef="code">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
    <td mat-cell *matCellDef="let user">{{ user.code }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Usuario</th>
    <td mat-cell *matCellDef="let user">{{ user.email }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
    <td mat-cell *matCellDef="let user">{{ user.name }}</td>
  </ng-container>

  <ng-container matColumnDef="created_at">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha de creación</th>
    <td mat-cell *matCellDef="let user">{{ user.created_at | date: 'dd/MM/yyyy HH:mm' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let user">
      <button mat-icon-button (click)="viewDetail(user.id)" title="Ver detalle">👁️</button>
      <button mat-icon-button (click)="edit(user.id)" title="Editar">✏️</button>
      <button mat-icon-button (click)="delete(user.id)" title="Eliminar">🗑️</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
